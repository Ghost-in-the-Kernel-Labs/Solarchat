<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300" role="img" aria-labelledby="t">
  <title id="t">Two panels in a row: plus of one to minus of the next</title>
  <rect x="0" y="0" width="400" height="300" fill="#ffffff"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#1a1a1a">
    <text x="16" y="30" font-size="20" font-weight="bold">TWO PANELS IN A ROW</text>
    <rect x="24" y="48" width="150" height="100" rx="4" fill="#1f4e79" stroke="#555555" stroke-width="3"/>
    <text x="99" y="104" font-size="20" font-weight="bold" text-anchor="middle" fill="#ffffff">A</text>
    <rect x="226" y="48" width="150" height="100" rx="4" fill="#1f4e79" stroke="#555555" stroke-width="3"/>
    <text x="301" y="104" font-size="20" font-weight="bold" text-anchor="middle" fill="#ffffff">B</text>
    <path d="M140 148 V190 H190" fill="none" stroke="#c62828" stroke-width="6"/>
    <rect x="186" y="180" width="18" height="20" fill="#c62828"/>
    <rect x="204" y="180" width="18" height="20" fill="#111111"/>
    <path d="M218 190 H260 V148" fill="none" stroke="#111111" stroke-width="6"/>
    <text x="204" y="226" font-size="18" text-anchor="middle">+ joined to −</text>
    <path d="M58 148 V250" fill="none" stroke="#111111" stroke-width="6"/>
    <rect x="48" y="250" width="20" height="26" rx="3" fill="#111111"/>
    <text x="80" y="270" font-size="22" font-weight="bold">−</text>
    <path d="M342 148 V250" fill="none" stroke="#c62828" stroke-width="6"/>
    <rect x="332" y="250" width="20" height="26" rx="3" fill="#c62828"/>
    <text x="316" y="270" font-size="22" font-weight="bold" fill="#c62828">+</text>
    <text x="200" y="290" font-size="16" text-anchor="middle">free ends go to the device</text>
  </g>
</svg>
