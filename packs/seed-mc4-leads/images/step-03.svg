<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300" role="img" aria-labelledby="t">
  <title id="t">Both connector halves must be the same make</title>
  <rect x="0" y="0" width="400" height="300" fill="#ffffff"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#1a1a1a">
    <text x="16" y="32" font-size="20" font-weight="bold">SAME MAKER, SAME SHAPE</text>
    <rect x="16" y="60" width="40" height="14" fill="#111111"/>
    <rect x="56" y="48" width="80" height="38" rx="6" fill="#111111"/>
    <text x="96" y="74" font-size="18" font-weight="bold" text-anchor="middle" fill="#ffffff">AB</text>
    <rect x="136" y="56" width="22" height="22" fill="#444444"/>
    <rect x="166" y="56" width="22" height="22" fill="#444444"/>
    <rect x="188" y="48" width="80" height="38" rx="6" fill="#111111"/>
    <text x="228" y="74" font-size="18" font-weight="bold" text-anchor="middle" fill="#ffffff">AB</text>
    <rect x="268" y="60" width="40" height="14" fill="#111111"/>
    <circle cx="340" cy="67" r="16" fill="#2e7d32"/>
    <path d="M331 67 l6 7 l12 -14" fill="none" stroke="#ffffff" stroke-width="4"/>
    <text x="200" y="118" font-size="18" text-anchor="middle">Compare the name, body and back nut</text>
    <rect x="16" y="140" width="368" height="144" rx="8" fill="#fdecea" stroke="#c62828" stroke-width="3"/>
    <text x="32" y="170" font-size="20" font-weight="bold" fill="#c62828">WRONG: two different makers</text>
    <rect x="40" y="196" width="80" height="38" rx="6" fill="#111111"/>
    <text x="80" y="222" font-size="18" font-weight="bold" text-anchor="middle" fill="#ffffff">AB</text>
    <rect x="120" y="204" width="22" height="22" fill="#444444"/>
    <path d="M154 196 h70 l14 19 l-14 19 h-70 z" fill="#333333"/>
    <text x="192" y="222" font-size="18" font-weight="bold" text-anchor="middle" fill="#ffffff">XY</text>
    <path d="M296 196 l36 36 M332 196 l-36 36" stroke="#c62828" stroke-width="6"/>
    <text x="200" y="268" font-size="18" text-anchor="middle">Fitting together is not enough</text>
  </g>
</svg>
