<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300" role="img" aria-labelledby="t">
  <title id="t">Panel plus to device plus, panel minus to device minus</title>
  <rect x="0" y="0" width="400" height="300" fill="#ffffff"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#1a1a1a">
    <text x="16" y="30" font-size="18" font-weight="bold">PANEL</text>
    <text x="384" y="30" font-size="18" font-weight="bold" text-anchor="end">DEVICE</text>
    <rect x="16" y="56" width="60" height="10" fill="#c62828"/>
    <rect x="76" y="44" width="70" height="34" rx="5" fill="#c62828"/>
    <text x="111" y="70" font-size="26" font-weight="bold" text-anchor="middle" fill="#ffffff">+</text>
    <text x="200" y="70" font-size="24" font-weight="bold" text-anchor="middle" fill="#c62828">→</text>
    <rect x="254" y="44" width="70" height="34" rx="5" fill="#c62828"/>
    <text x="289" y="70" font-size="26" font-weight="bold" text-anchor="middle" fill="#ffffff">+</text>
    <rect x="324" y="56" width="60" height="10" fill="#c62828"/>
    <rect x="16" y="116" width="60" height="10" fill="#111111"/>
    <rect x="76" y="104" width="70" height="34" rx="5" fill="#111111"/>
    <text x="111" y="130" font-size="26" font-weight="bold" text-anchor="middle" fill="#ffffff">−</text>
    <text x="200" y="130" font-size="24" font-weight="bold" text-anchor="middle">→</text>
    <rect x="254" y="104" width="70" height="34" rx="5" fill="#111111"/>
    <text x="289" y="130" font-size="26" font-weight="bold" text-anchor="middle" fill="#ffffff">−</text>
    <rect x="324" y="116" width="60" height="10" fill="#111111"/>
    <circle cx="200" cy="164" r="14" fill="#2e7d32"/>
    <path d="M192 164 l5 6 l11 -12" fill="none" stroke="#ffffff" stroke-width="4"/>
    <rect x="16" y="190" width="368" height="98" rx="8" fill="#fdecea" stroke="#c62828" stroke-width="3"/>
    <text x="32" y="216" font-size="18" font-weight="bold" fill="#c62828">WRONG: plus to minus</text>
    <rect x="40" y="236" width="60" height="30" rx="5" fill="#c62828"/>
    <text x="70" y="259" font-size="24" font-weight="bold" text-anchor="middle" fill="#ffffff">+</text>
    <text x="140" y="259" font-size="22" font-weight="bold" text-anchor="middle">→</text>
    <rect x="180" y="236" width="60" height="30" rx="5" fill="#111111"/>
    <text x="210" y="259" font-size="24" font-weight="bold" text-anchor="middle" fill="#ffffff">−</text>
    <path d="M300 232 l36 36 M336 232 l-36 36" stroke="#c62828" stroke-width="6"/>
  </g>
</svg>
