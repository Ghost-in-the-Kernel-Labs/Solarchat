<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300" role="img" aria-labelledby="t">
  <title id="t">Cover the panel, then open the connectors with the release tool</title>
  <rect x="0" y="0" width="400" height="300" fill="#ffffff"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#1a1a1a">
    <text x="16" y="30" font-size="20" font-weight="bold">COVER, THEN USE THE TOOL</text>
    <rect x="16" y="48" width="110" height="80" fill="#4e342e"/>
    <text x="71" y="94" font-size="16" font-weight="bold" text-anchor="middle" fill="#ffffff">covered</text>
    <rect x="150" y="76" width="90" height="34" rx="5" fill="#111111"/>
    <rect x="240" y="76" width="90" height="34" rx="5" fill="#111111"/>
    <path d="M222 54 l18 22 l18 -22" fill="none" stroke="#1565c0" stroke-width="7"/>
    <text x="240" y="146" font-size="18" text-anchor="middle">release tool on the tabs</text>
    <circle cx="364" cy="93" r="16" fill="#2e7d32"/>
    <path d="M355 93 l6 7 l12 -14" fill="none" stroke="#ffffff" stroke-width="4"/>
    <rect x="16" y="166" width="368" height="120" rx="8" fill="#fdecea" stroke="#c62828" stroke-width="3"/>
    <text x="32" y="192" font-size="18" font-weight="bold" fill="#c62828">WRONG: pulling apart in sun</text>
    <circle cx="52" cy="236" r="16" fill="#f9a825"/>
    <rect x="80" y="214" width="60" height="46" fill="#1f4e79"/>
    <path d="M140 240 H180" stroke="#111111" stroke-width="5"/>
    <rect x="180" y="228" width="34" height="24" rx="4" fill="#111111"/>
    <text x="222" y="250" font-size="20" font-weight="bold">← →</text>
    <rect x="262" y="228" width="34" height="24" rx="4" fill="#111111"/>
    <path d="M318 218 l36 36 M354 218 l-36 36" stroke="#c62828" stroke-width="6"/>
  </g>
</svg>
