<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300" role="img" aria-labelledby="t">
  <title id="t">Charge controller: battery connected first, panel last</title>
  <rect x="0" y="0" width="400" height="300" fill="#ffffff"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#1a1a1a">
    <text x="16" y="30" font-size="20" font-weight="bold">CHARGE CONTROLLER ONLY</text>
    <rect x="140" y="60" width="120" height="100" rx="8" fill="#f3f3f3" stroke="#555555" stroke-width="3"/>
    <text x="200" y="100" font-size="18" font-weight="bold" text-anchor="middle">CONTROL</text>
    <circle cx="200" cy="130" r="9" fill="#2e7d32"/>
    <text x="216" y="136" font-size="16">on</text>
    <rect x="150" y="214" width="100" height="60" rx="6" fill="#555555"/>
    <text x="200" y="250" font-size="18" font-weight="bold" text-anchor="middle" fill="#ffffff">BATTERY</text>
    <path d="M180 214 V160" stroke="#c62828" stroke-width="5"/>
    <path d="M220 214 V160" stroke="#111111" stroke-width="5"/>
    <circle cx="112" cy="244" r="20" fill="#1f4e79"/>
    <text x="112" y="252" font-size="22" font-weight="bold" text-anchor="middle" fill="#ffffff">1</text>
    <circle cx="300" cy="60" r="20" fill="#1f4e79"/>
    <text x="300" y="68" font-size="22" font-weight="bold" text-anchor="middle" fill="#ffffff">2</text>
    <path d="M384 100 H300 V112 H260" fill="none" stroke="#c62828" stroke-width="5" stroke-dasharray="10 6"/>
    <path d="M384 140 H260" fill="none" stroke="#111111" stroke-width="5" stroke-dasharray="10 6"/>
    <text x="330" y="180" font-size="18" text-anchor="middle">panel</text>
    <text x="330" y="202" font-size="18" text-anchor="middle">goes last</text>
  </g>
</svg>
