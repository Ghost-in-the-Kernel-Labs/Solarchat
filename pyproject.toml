# Tool configuration only: this project is not a package to install (Neon Rain R-001, R-017).
# STAMP: replace PROJECT with the product package's folder (docs/modules.json's package).

[tool.pytest.ini_options]
testpaths = ["test"]
pythonpath = ["."]
addopts = "-q -m 'not slow'"
markers = ["slow: its own budget; the gate runs it"]

[tool.ruff]
target-version = "py312"
line-length = 120
# The planted breaks are broken on purpose; the linter does not read them (J-004).
extend-exclude = ["test/fixtures/broken"]

[tool.ruff.lint]
# The readability rules a linter can say: type hints on every function (ANN), no bare except (E722), the common
# bug patterns (B). The rest is scripts/checks/readability.py.
select = ["E4", "E7", "E9", "F", "ANN", "B"]
# B905 (zip without strict=) is off, as the template had it.
ignore = ["B905"]
